services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage

  webdav:
    image: bytemark/webdav
    restart: unless-stopped
    ports:
      - "5005:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: obsidian
      PASSWORD: ${WEBDAV_PASSWORD}
    volumes:
      - obsidian_vault:/var/lib/dav/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file: .env
    environment:
      # Переопределяем значения из config.yaml — внутри docker-compose сервисы видны по именам
      QDRANT_URL: http://qdrant:6333
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL}   # приложение ходит к LLM через шлюз
      OBSIDIAN_VAULT: /vault
    volumes:
      - ragv2_data:/app/data
      - hf_cache:/cache/huggingface
      - fastembed_cache:/cache/fastembed
      - obsidian_vault:/vault:rw   # тот же volume что и у webdav; rw нужен для записи отчётов инкрементальной индексации
    depends_on:
      - qdrant
      - webdav

  # — Метрики хоста (CPU/RAM/диск/сеть) для Prometheus на 10.0.0.30 —
  node_exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host   # проще всего отдаёт реальные метрики хоста, без NAT; слушает :9100 напрямую
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    mem_limit: 128m

  # — Метрики по каждому контейнеру (CPU/RAM/IO на контейнер) —
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 128m

volumes:
  qdrant_storage:
  ragv2_data:
  hf_cache:
  fastembed_cache:
  obsidian_vault:
